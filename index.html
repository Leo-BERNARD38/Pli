<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#E9E2D2" />
    <meta name="color-scheme" content="light" />
    <title>Pli</title>

    <!-- Les icônes et le manifeste, à coller telles quelles dans les deux entrées
         (docs/installation.md#le-manifeste-et-les-icônes). Noms stables, jamais empreintés :
         une icône posée sur son écran d'accueil pointe une adresse qui doit rester valable. -->
    <link rel="icon" href="/icones/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icones/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <link rel="manifest" href="/icones/site.webmanifest" />

    <!-- L'aperçu du lien dans la conversation. Il est le même pour tous les plis : le
         fragment ne quitte jamais l'appareil, le fabricant d'aperçu ne voit que
         leo-bernard38.github.io/Pli/
         (docs/partage.md#les-balises-écrites-une-fois-pour-toutes). -->
    <meta property="og:title" content="Un pli t'attend." />
    <meta property="og:description" content="Il ne s'ouvre qu'une fois." />
    <meta property="og:image" content="https://leo-bernard38.github.io/Pli/icones/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://leo-bernard38.github.io/Pli/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pli" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="description" content="Un pli t'attend. Il ne s'ouvre qu'une fois." />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <!-- Les deux flèches du produit, écrites par scripts/fleches.py.
         L'unique exception au « pas de SVG », nommée et fermée
         (docs/design-system.md#ton-et-vocabulaire). On ne les retouche pas : on regénère.
         width et height à zéro sur le conteneur : un <svg> sans dimension occupe 300 × 150
         avant toute feuille de style, et display:none casserait le <use> sur WebKit. -->
    <svg class="fleches" width="0" height="0" aria-hidden="true" focusable="false"><defs>
      <symbol id="fleche-haut" viewBox="0 0 1000 1000"><path d="M500.0 125.0L839.8 440.2L578.0 340.4L578.0 865.0L693.0 865.0L693.0 875.0L307.0 875.0L307.0 865.0L422.0 865.0L422.0 340.4L160.2 440.2Z"/></symbol>
      <symbol id="fleche-droite" viewBox="0 0 1000 1000"><path d="M875.0 500.0L559.8 839.8L659.6 578.0L135.0 578.0L135.0 693.0L125.0 693.0L125.0 307.0L135.0 307.0L135.0 422.0L659.6 422.0L559.8 160.2Z"/></symbol>
    </defs></svg>

    <!-- Les deux écrans que le document porte lui-même, parce qu'ils sont la vague 1 :
         ils doivent s'afficher sans qu'une seule requête s'interpose
         (docs/chargement.md#vague-1--le-document-se-suffit-à-lui-même). A2, qui dépend du
         type et du contenu, se construit en vague 3 dans la couche du dessous.

         `.pli` est le cadre — l'écran entier, touch-action. Les deux couches
         du geste vivent dedans : « dessus » et « dessous » sont les mots de l'algorithme du
         dépliage (docs/design-system.md#le-mouvement). -->
    <main class="pli">
      <div class="pli__dessous" hidden></div>

      <!-- A1 · l'attente. Commune aux quatre types ; seules l'étiquette de la tête et la
           promesse changent. Le fond est le rideau, la seule image des états fermés — il ne
           dit rien du contenu, c'est tout son intérêt (docs/parcours.md#a1--lattente). -->
      <section class="pli__dessus pli--encre" id="a1">
        <div class="image image--pleine image--rideau">
          <img alt="" decoding="async" fetchpriority="low" />
          <div class="image__fondu image__fondu--encre"></div>
        </div>

        <!-- Ni la tête ni le numéro ne portent le carmin, contrairement à la maquette :
             sur A1 la seule chose qui agit est le volet, et « une seule couleur agit »
             (docs/design-system.md#les-cinq-règles). Mesuré en plus, sur ce que le
             navigateur peint vraiment : en rose, 19,7 % de la ligne du numéro tombait sous
             4,5:1 sur les stries claires du rideau. -->
        <header class="tete">
          <p class="marque">Pli</p>
          <p class="etiquette" data-type></p>
        </header>

        <!-- Seul l'invariant est écrit ici — la marque, la promesse, « déplier ». Les
             emplacements que le lien remplit restent VIDES : `decoder()` traverse un
             DecompressionStream, et pour un `#p=` c'est un aller-retour réseau complet.
             Les remplir en dur ferait peindre « UNE INVITATION » sur une pensée, et
             pendant tout le fetch sur un poème. Rien de faux n'est jamais peint. -->
        <div class="corps">
          <p class="etiquette" data-numero></p>
          <h1 class="voix">Un pli t’attend.</h1>
          <!-- La promesse est le seul emplacement du lien qui soit ÉCRIT ICI. Les autres
               restent vides — voir plus haut. Elle, non : vide, elle laisserait un trou sous
               le titre le temps du décodage, et un poème attend un aller-retour réseau
               entier. La phrase en dur est celle de l'invitation ; `ecrire()` lui substitue
               celle du type dans la même frame que le numéro et la signature, donc sans un
               saut de plus (src/lecteur/a1.ts). -->
          <p class="voix voix--corps" data-promesse>
            Il ne s’ouvre qu’une fois. Ensuite il reste dans tes plis.
          </p>
          <p class="etiquette etiquette--fine" data-signature></p>
        </div>

        <p class="cachet" data-cachet></p>

        <!-- Le volet, et la seule action de l'écran. Le bouton est l'alternative au geste,
             jamais un second chemin caché : il pose p = 1 directement
             (docs/design-system.md#accessibilité). -->
        <div class="volet">
          <div class="invite">
            <button class="deplier" type="button">
              <span class="etiquette etiquette--forte">déplier</span>
              <svg class="fleche" aria-hidden="true" focusable="false"><use href="#fleche-haut" /></svg>
            </button>
            <p class="etiquette etiquette--fine">glisser vers le haut</p>
          </div>
        </div>
      </section>

      <!-- C5 · l'attente du fichier — LE POÈME SEUL, et le seul écran du produit qui dépend
           du réseau (docs/chargement.md#le-poème-le-seul-cas-qui-dépend-du-réseau). Il ne
           s'affiche que si l'attente DURE : sur un aller-retour ordinaire, il ne se voit
           jamais, et un clignotement serait pire que rien.

           La composition vient de la maquette (design/canevas/) : la marque, un pointillé
           carmin, un mot. Elle centre verticalement, ce qu'aucun autre écran du produit ne
           fait — c'est un écran sans contenu, il n'a rien à aligner en bas (l'écart est
           noté dans docs/integration.md). -->
      <section class="pli__dessus c5" id="c5" hidden>
        <p class="marque respire">Pli</p>
        <div class="pointille respire"></div>
        <p class="etiquette etiquette--fine">un pli arrive</p>
      </section>

      <!-- HORS LIGNE — le réseau a lâché, et ce n'est PAS un lien abîmé. Un fichier absent
           est définitif, un réseau coupé passe : les confondre, c'est dire à quelqu'un que
           son pli est perdu alors qu'il l'attend (docs/roadmap.md#le-poème). Le poème seul
           peut y tomber, c'est le seul écran qui dépend du réseau. -->
      <section class="pli__dessus" id="hors-ligne" hidden>
        <header class="tete">
          <p class="marque">Pli</p>
        </header>

        <div class="corps">
          <h1 class="titre">pas de réseau</h1>
          <p class="voix voix--corps">Le pli est là. Il n’a pas pu arriver jusqu’ici.</p>
          <!-- Sans flèche, et c'est délibéré : les deux autres actions du produit —
               « relire le pli », « envoyer » — mènent quelque part, et la flèche dit ce
               déplacement. « réessayer » ne va nulle part, il redemande le même fichier à la
               même adresse. Une flèche promettrait un ailleurs qui n'existe pas. -->
          <button class="action" type="button" id="reessayer">
            <span class="etiquette carmin">réessayer</span>
          </button>
        </div>
      </section>

      <!-- C4 · le lien abîmé. Le cas réel n'est pas l'expiration — il n'y en a plus — mais
           le lien tronqué par la messagerie (docs/integration.md). Aucune image : le rideau
           est celle des états FERMÉS, et un lien abîmé n'en est pas un. -->
      <section class="pli__dessus" id="c4" hidden>
        <header class="tete">
          <p class="marque">Pli</p>
        </header>

        <div class="corps">
          <h1 class="titre">lien abîmé</h1>
          <p class="voix voix--corps">Il a dû être coupé en chemin. Redemande-le-moi.</p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/lecteur/main.ts"></script>
  </body>
</html>
