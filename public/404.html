<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E9E2D2" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Pli</title>
    <!--
      Le seul filet de GitHub Pages : aucune redirection, aucune règle (docs/hebergement.md).
      Cette page est servie telle quelle depuis public/ — son style est ici, en entier, pour
      qu'elle ne dépende d'aucun fichier empreinté.
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100dvh;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 26px;
        background: #f7f2e8;
        color: #14100e;
        font-family: ui-monospace, monospace;
        -webkit-text-size-adjust: 100%;
        color-scheme: light;
      }
      .marque {
        margin: 0;
      }
      .plis {
        margin: 0;
        color: #c81e33;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .fleche {
        width: 1em;
        height: 1em;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <!-- Les deux flèches du produit, écrites par scripts/fleches.py.
         L'unique exception au « pas de SVG », nommée et fermée
         (docs/design-system.md#ton-et-vocabulaire). On ne les retouche pas : on regénère.
         width et height à zéro sur le conteneur : un <svg> sans dimension occupe 300 × 150
         avant toute feuille de style, et display:none casserait le <use> sur WebKit. -->
    <svg class="fleches" width="0" height="0" aria-hidden="true" focusable="false"><defs>
      <symbol id="fleche-haut" viewBox="0 0 1000 1000"><path d="M500.0 125.0L839.8 440.2L578.0 340.4L578.0 865.0L693.0 865.0L693.0 875.0L307.0 875.0L307.0 865.0L422.0 865.0L422.0 340.4L160.2 440.2Z"/></symbol>
      <symbol id="fleche-droite" viewBox="0 0 1000 1000"><path d="M875.0 500.0L559.8 839.8L659.6 578.0L135.0 578.0L135.0 693.0L125.0 693.0L125.0 307.0L135.0 307.0L135.0 422.0L659.6 422.0L559.8 160.2Z"/></symbol>
    </defs></svg>

    <p class="marque">Pli</p>
    <a class="plis" href="/"
      >tes plis<svg class="fleche" aria-hidden="true" focusable="false"><use
        href="#fleche-haut"
      /></svg
    ></a>
  </body>
</html>
