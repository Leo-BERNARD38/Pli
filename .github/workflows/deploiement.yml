# Le déploiement, sur push vers main (docs/hebergement.md#ce-qui-est-déployé).
# Un déploiement remplace le site entier — il ne le fusionne pas
# (docs/mises-a-jour.md#la-fenêtre-de-dix-minutes).
name: deploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, et on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run verifie
      - run: npm test
      # Les mêmes contrôles que `verif`, dans le même ordre : ce qui part chez elle ne se
      # rattrape pas, et `main` peut recevoir un commit direct qu'aucune PR n'a relu.
      - run: npm run types
      - run: npm run build

      # dist/ porte déjà .nojekyll et 404.html, copiés de public/. Pas de CNAME : le site
      # est servi sous leo-bernard38.github.io/Pli/ (docs/hebergement.md#ladresse).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploiement:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
